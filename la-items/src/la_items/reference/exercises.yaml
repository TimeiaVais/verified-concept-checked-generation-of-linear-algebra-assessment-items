# Reference set: course exercises with hand-written concept labels.
#
# Source: Стороженко І. П. Вища математика. Ч. I. Лінійна алгебра і аналітична геометрія.
#   Харків : ХНТУСГ, 2019. Exercises on pages 18, 19, 28, 31; answers on pages 73–78.
#
# Each entry is one part of one exercise: when an exercise asks for two things (both the matrix
# method and Cramer's rule, or eigenvalues and eigenvectors), only the part named in `task` is
# encoded, and `label` covers that part only.
#
# `label` is written by hand from the textbook section and the method the exercise names, never
# from a trace (ADR-0006). Where the exercise names no method, the label follows the method the
# book itself uses for that topic:
#   - a 3×3 determinant is defined by the six-term formula on p. 10: det_3x3_triangle;
#   - the worked Cramer example on p. 24 expands 3×3 determinants by a line: cofactor_expansion,
#     minor, cofactor_sign, det_2x2;
#   - the worked eigenvalue example on p. 26 expands det(A − λE) by the first row.
# `main_concept` is the concept the section is about.
# `book_answer` is the answer printed in the book, as a SymPy expression; a vector answer is a
# list. `book_erratum` explains an answer that does not fit the printed exercise.
# Skipped: exercises with parameters (1.86 в, 1.87, 1.89), 4×4 determinants (1.91 в, г), properties
# of determinants (1.90), inverse matrices (1.92, 1.93), the inconsistent system 2.16, complex
# eigenvalues (2.40) and eigenvector checks (2.49–2.51).

