[project]
name = "la-items"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts", "graph", "steplib"]

[tool.setuptools.package-data]
graph = ["concepts.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
